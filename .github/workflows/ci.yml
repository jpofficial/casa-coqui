# GitHub Actions CI — visible green checks on pull requests.
#
# Production delivery still runs on AWS CodeBuild/CodePipeline (see ci/ and
# infra/stacks/pipeline_stack.py); that pipeline is not surfaced on GitHub.
# This workflow exists so PRs show lint + test status, and it runs the same
# checks a contributor runs locally:
#   npm run install:all   → root + functions + Lambda + SAM dependencies
#   npm run lint          → next lint (root app)
#   npm run check:prompt-drift
#   npm run check:shared  → generated copies (functions/lib/*) match their lib/ sources
#   npm test              → every JavaScript suite (lib, functions, Lambda, SAM)
#   pytest infra/tests    → CDK stack assertions + snapshot (Python)
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: Lint + JS test suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Playwright is a devDependency for local e2e only; skip its ~150 MB
      # browser download (same setting the CodeBuild buildspec uses).
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            infra/lambda/parse-airbnb-email/package-lock.json
            infra/sam/reply-agent/package-lock.json
            infra/sam/reply-agent/functions/reasoner/package-lock.json
            infra/sam/reply-agent/functions/write-back/package-lock.json

      - name: Install (root, functions, Lambda, SAM)
        run: npm run install:all

      - name: Lint (next lint)
        run: npm run lint

      - name: Prompt drift check
        run: npm run check:prompt-drift

      - name: Shared-module copies in sync
        run: npm run check:shared

      - name: JS test suites
        run: npm test

  infra:
    name: CDK unit tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      # aws-cdk-lib is a jsii package — it needs a Node runtime available.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            infra/requirements.txt
            infra/requirements-dev.txt

      - name: Install CDK + test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest
        run: python -m pytest tests -q
