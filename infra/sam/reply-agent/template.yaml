AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

# ---------------------------------------------------------------------------
# Casa Coqui — Reply Agent (Phase 1 of SFN refactor)
#
# Deploys a Step Functions Standard outer workflow (ReplyDraftSM) that
# orchestrates an Express child workflow (AIChain) over six Lambda functions.
# The Firebase Cloud Function onAirbnbMessageCreated will (in Phase 3) call
# StartExecution on this state machine instead of running the chain in-process.
#
# Resources created:
#   * 6 Lambda functions (LoadConfig, RAGRetrieve, Reasoner, Drafter, Evaluator,
#     Reviser, WriteBackToFirestore)
#   * 1 SFN Standard state machine (ReplyDraftSM) — orchestrates the workflow
#   * 1 SFN Express state machine (AIChain) — runs the 4 AI calls
#   * IAM roles for each Lambda and each state machine
#
# Resources referenced (existing, NOT created):
#   * Secrets Manager: casa-coqui/anthropic-api-key
#   * Secrets Manager: casa-coqui/firebase-service-account
#
# Parameters:
#   * ModelName — Anthropic model id (default: claude-haiku-4-5-20251001)
#
# Deletion policy: every resource is DELETE except SFN log groups (RETAIN
# for 7 days so we can debug after teardown).
# ---------------------------------------------------------------------------

Description: >
  Casa Coqui Reply Agent — Step Functions orchestration of the AI reply chain
  for inbound Airbnb guest messages. Phase 1 of casa-coqui-sfn-refactor-plan.md.

# ---------------------------------------------------------------------------
# Parameters — values you can override at deploy time via --parameter-overrides
# ---------------------------------------------------------------------------
Parameters:
  ModelName:
    Type: String
    Default: claude-haiku-4-5-20251001
    Description: Anthropic model id used by every AI Lambda

  AnthropicSecretName:
    Type: String
    Default: casa-coqui/anthropic-api-key
    Description: Secrets Manager name (NOT ARN) of the Anthropic API key

  FirebaseSecretName:
    Type: String
    Default: casa-coqui/firebase-service-account
    Description: Secrets Manager name of the Firebase service account JSON

  LogRetentionDays:
    Type: Number
    Default: 7
    Description: CloudWatch log retention (days) for Lambda + SFN logs

  AppConfigExtensionLayerArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:027255383542:layer:AWS-AppConfig-Extension-Arm64:122
    Description: |
      AWS-published AppConfig Extension Lambda Layer ARN for arm64/us-east-1.
      Pinned to v122 (2025-01-14). Update by changing the version suffix.
      Reference: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-integration-lambda-extensions.html

  ModelDefault:
    Type: String
    Default: claude-haiku-4-5-20251001
    Description: Initial value for /casa-coqui/reply-agent/model SSM parameter

  TemperatureDefault:
    Type: String
    Default: "1.0"
    Description: Initial value for /casa-coqui/reply-agent/temperature SSM parameter

  AlertEmail:
    Type: String
    Default: 01juliop@gmail.com
    Description: Email subscriber for SNS DLQ + bridge alarms

# ---------------------------------------------------------------------------
# Globals — defaults applied to every resource of a given type. DRYs the file.
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-specification-template-anatomy-globals.html
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]              # cheaper + faster than x86_64
    Timeout: 30
    MemorySize: 256
    Tracing: Active                     # X-Ray distributed tracing
    Environment:
      Variables:
        MODEL_NAME: !Ref ModelName
        ANTHROPIC_SECRET_NAME: !Ref AnthropicSecretName
        POWERTOOLS_SERVICE_NAME: reply-agent
        POWERTOOLS_LOG_LEVEL: INFO

# ---------------------------------------------------------------------------
# Resources — the actual things CFN creates
# ---------------------------------------------------------------------------
Resources:

  # -------------------------------------------------------------------------
  # 1. Lambda functions — six small handlers, one job each.
  #    Each declares its own minimal IAM via Policies (least privilege).
  # -------------------------------------------------------------------------

  LoadConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: casa-coqui-reply-load-config
      CodeUri: functions/load-config/
      Handler: index.handler
      Description: Fetches model + temperature from SSM at workflow start
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: ssm:GetParameters
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/casa-coqui/reply-agent/*

  RAGRetrieveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: casa-coqui-reply-rag-retrieve
      CodeUri: functions/rag-retrieve/
      Handler: index.handler
      Description: Vector search over the voice corpus (placeholder in Phase 1)
      MemorySize: 512                   # vector search needs more headroom

  ReasonerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: casa-coqui-reply-reasoner
      CodeUri: functions/reasoner/
      Handler: index.handler
      Description: Step 1 of AI chain — produces a response strategy
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AnthropicSecretName}-*

  DrafterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: casa-coqui-reply-drafter
      CodeUri: functions/drafter/
      Handler: index.handler
      Description: Step 2 of AI chain — drafts the actual reply
      Layers:
        - !Ref AppConfigExtensionLayerArn
      Environment:
        Variables:
          APPCONFIG_APPLICATION: !Ref ReplyAgentApplication
          APPCONFIG_ENVIRONMENT: !Ref ReplyAgentProdEnvironment
          APPCONFIG_PROFILE: !Ref SystemPromptProfile
          AWS_APPCONFIG_EXTENSION_PRELOAD_LIST: !Sub applications/${ReplyAgentApplication}/environments/${ReplyAgentProdEnvironment}/configurations/${SystemPromptProfile}
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AnthropicSecretName}-*
            # AppConfig IAM model — uses the `appconfig:` prefix (NOT
            # `appconfigdata:`) when called via the AWS-published Lambda Extension.
            # This is a confusing AWS quirk: the API endpoint is appconfigdata,
            # but the Extension authorizes with the `appconfig:` prefix actions.
            # Verified from runtime AccessDeniedException showing the Extension
            # checking `appconfig:StartConfigurationSession`.
            # Direct SDK callers (without the Extension) use `appconfigdata:*`.
            - Effect: Allow
              Action:
                - appconfig:StartConfigurationSession
                - appconfig:GetConfiguration
              Resource:
                - !Sub arn:aws:appconfig:${AWS::Region}:${AWS::AccountId}:application/${ReplyAgentApplication}/environment/${ReplyAgentProdEnvironment}/configuration/${SystemPromptProfile}

  EvaluatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: casa-coqui-reply-evaluator
      CodeUri: functions/evaluator/
      Handler: index.handler
      Description: Step 3 of AI chain — scores the draft against voice + RAG
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AnthropicSecretName}-*

  ReviserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: casa-coqui-reply-reviser
      CodeUri: functions/reviser/
      Handler: index.handler
      Description: Step 4 of AI chain — rewrites draft if Evaluator failed it
      Layers:
        - !Ref AppConfigExtensionLayerArn
      Environment:
        Variables:
          APPCONFIG_APPLICATION: !Ref ReplyAgentApplication
          APPCONFIG_ENVIRONMENT: !Ref ReplyAgentProdEnvironment
          APPCONFIG_PROFILE: !Ref SystemPromptProfile
          AWS_APPCONFIG_EXTENSION_PRELOAD_LIST: !Sub applications/${ReplyAgentApplication}/environments/${ReplyAgentProdEnvironment}/configurations/${SystemPromptProfile}
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AnthropicSecretName}-*
            # See DrafterFunction for the appconfig: prefix rationale.
            - Effect: Allow
              Action:
                - appconfig:StartConfigurationSession
                - appconfig:GetConfiguration
              Resource:
                - !Sub arn:aws:appconfig:${AWS::Region}:${AWS::AccountId}:application/${ReplyAgentApplication}/environment/${ReplyAgentProdEnvironment}/configuration/${SystemPromptProfile}

  WriteBackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: casa-coqui-reply-write-back
      CodeUri: functions/write-back/
      Handler: index.handler
      Description: Final step — writes draftReply to Firestore via Firebase Admin
      Timeout: 60                       # Firestore write can be slow on cold start
      # ── W7 TRAP STATE (Phase 3) ─────────────────────────────────────────
      # The original Phase 1 scaffold included an inline Policy granting
      # secretsmanager:GetSecretValue on the firebase-service-account secret.
      # Phase 3 INTENTIONALLY removes it before the first deploy so the
      # Lambda fails at runtime with AccessDenied — drilling cross-cloud
      # IAM debugging (W7 surface). Step 12 restores the grant.
      # See: docs/superpowers/specs/2026-05-08-phase-3-sfn-bridge-design.md
      #      "The W7 Break-It Trap (pedagogical)" section.
      # Policies: <intentionally absent until Step 12>

  # -------------------------------------------------------------------------
  # Phase 3 — DLQ + SNS + DLQ Notifier
  # -------------------------------------------------------------------------

  ReplyDraftDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: casa-coqui-reply-draft-dlq
      MessageRetentionPeriod: 1209600  # 14 days
      SqsManagedSseEnabled: true        # SSE — payloads contain Firestore ids / threadKeys

  ReplyDraftFailureTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: casa-coqui-reply-draft-failures
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email

  DLQNotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: casa-coqui-reply-dlq-notifier
      CodeUri: functions/dlq-notifier/
      Handler: index.handler
      Description: Formats SQS DLQ messages and publishes to SNS
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref ReplyDraftFailureTopic
      Events:
        DLQTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt ReplyDraftDLQ.Arn
            BatchSize: 10
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref ReplyDraftFailureTopic

  # -------------------------------------------------------------------------
  # Phase 3 — CloudWatch Alarms
  # -------------------------------------------------------------------------

  SFNExecutionsFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: casa-coqui-reply-draft-executions-failed
      AlarmDescription: SFN executions failing — wired to AppConfig Monitor for auto-rollback
      MetricName: ExecutionsFailed
      Namespace: AWS/States
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching   # CRITICAL — low-volume app
      Dimensions:
        - Name: StateMachineArn
          # Hardcoded ARN via !Sub — no CFN dependency on ReplyDraftStateMachine
          # so the AppConfig Monitor cycle is broken. The StateMachine name
          # `casa-coqui-reply-draft` is fixed in the resource (line ~627);
          # changing it requires updating both places.
          Value: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:casa-coqui-reply-draft"
      AlarmActions:
        - !Ref ReplyDraftFailureTopic

  BridgeFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: casa-coqui-bridge-route-failures
      AlarmDescription: Bridge BridgeRouteFailures > 5 in 5 min — Cloud Function path may be unhealthy
      MetricName: BridgeRouteFailures
      Namespace: CasaCoqui/Bridge
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ReplyDraftFailureTopic

  AnthropicThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: casa-coqui-anthropic-throttles
      MetricName: AnthropicThrottles
      Namespace: CasaCoqui/Chain
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ReplyDraftFailureTopic

  LatencyP95Alarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: casa-coqui-reply-draft-latency-p95
      MetricName: ExecutionTime
      Namespace: AWS/States
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 1
      Threshold: 30000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: StateMachineArn
          # Hardcoded ARN — same cycle-break reasoning as SFNExecutionsFailedAlarm.
          Value: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:casa-coqui-reply-draft"
      AlarmActions:
        - !Ref ReplyDraftFailureTopic

  # -------------------------------------------------------------------------
  # Phase 3 — AppConfig Monitor on the prod Environment (Decision 10 + 14)
  # -------------------------------------------------------------------------

  AppConfigMonitorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: casa-coqui-appconfig-monitor
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: appconfig.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DescribeAlarms
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: !GetAtt SFNExecutionsFailedAlarm.Arn

  # -------------------------------------------------------------------------
  # Phase 3 — Bridge IAM user (Firebase Cloud Function → AWS)
  # Long-lived access key per Decision 5 + rotation runbook (Step 15.3.1).
  # Stored in Firebase Functions secrets (defineSecret) AND mirrored into
  # Vercel env (regenerate API runtime — Step 16.2.1).
  # -------------------------------------------------------------------------

  BridgeIamUser:
    Type: AWS::IAM::User
    Properties:
      UserName: casa-coqui-firebase-bridge
      Policies:
        - PolicyName: SfnStartExecutionScoped
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref ReplyDraftStateMachine
              - Effect: Allow
                Action:
                  - appconfigdata:StartConfigurationSession
                  - appconfigdata:GetLatestConfiguration
                Resource: !Sub arn:aws:appconfig:${AWS::Region}:${AWS::AccountId}:application/${ReplyAgentApplication}/environment/${ReplyAgentProdEnvironment}/configuration/${FeatureFlagsProfile}
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: CasaCoqui/Bridge

  # -------------------------------------------------------------------------
  # SSM Parameters — non-secret hot-tunable model knobs.
  # Read by LoadConfig at workflow start; result threaded through SFN state.
  # -------------------------------------------------------------------------

  ModelParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /casa-coqui/reply-agent/model
      Type: String
      Value: !Ref ModelDefault
      Description: Anthropic model id used by the reply agent chain Lambdas

  TemperatureParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /casa-coqui/reply-agent/temperature
      Type: String
      Value: !Ref TemperatureDefault
      Description: Sampling temperature for Anthropic calls (parsed as float)

  # -------------------------------------------------------------------------
  # AppConfig — static resources (no HostedConfigurationVersions yet).
  # HCVs + Deployments land in Task 7 (Commit A) with deliberately broken
  # seed content to trigger the W7 validator trap. Task 8 (Commit B) fixes
  # the seed.
  # -------------------------------------------------------------------------

  ReplyAgentApplication:
    Type: AWS::AppConfig::Application
    Properties:
      Name: casa-coqui-reply-agent
      Description: Casa Coqui Airbnb reply-agent configuration

  ReplyAgentProdEnvironment:
    Type: AWS::AppConfig::Environment
    Properties:
      ApplicationId: !Ref ReplyAgentApplication
      Name: prod
      Description: Production environment (Phase 3 wires SFNExecutionsFailedAlarm Monitor)
      Monitors:
        - AlarmArn: !GetAtt SFNExecutionsFailedAlarm.Arn
          AlarmRoleArn: !GetAtt AppConfigMonitorRole.Arn

  SystemPromptProfile:
    Type: AWS::AppConfig::ConfigurationProfile
    Properties:
      ApplicationId: !Ref ReplyAgentApplication
      Name: system-prompt
      Description: |
        Host voice prompt + voice rules. Validated against a JSON Schema
        that requires version, language_distribution, hard_bans, system_prompt_text.
      Type: AWS.Freeform
      LocationUri: hosted
      Validators:
        - Type: JSON_SCHEMA
          Content: |
            {
              "$schema": "http://json-schema.org/draft-04/schema#",
              "type": "object",
              "required": ["version", "language_distribution", "hard_bans", "system_prompt_text"],
              "properties": {
                "version": {
                  "type": "string",
                  "pattern": "^[0-9]+\\.[0-9]+\\.[0-9]+$"
                },
                "language_distribution": {
                  "type": "object",
                  "additionalProperties": { "type": "number" }
                },
                "hard_bans": {
                  "type": "array",
                  "items": { "type": "string" }
                },
                "system_prompt_text": {
                  "type": "string",
                  "minLength": 100
                }
              }
            }

  FeatureFlagsProfile:
    Type: AWS::AppConfig::ConfigurationProfile
    Properties:
      ApplicationId: !Ref ReplyAgentApplication
      Name: feature-flags
      Description: |
        Feature flags for the reply agent. Phase 2 ships flag reply_engine
        with no consumer; Phase 3 wires the Cloud Function to read it.
      Type: AWS.AppConfig.FeatureFlags
      LocationUri: hosted

  LinearDeploymentStrategy:
    Type: AWS::AppConfig::DeploymentStrategy
    Properties:
      Name: casa-coqui-linear-10pct
      Description: |
        Linear rollout, 10% step every 1 minute, 5 minute bake at 100%.
        Pedagogical (Plan §4.2). At 10 msg/day volume the bake window
        observes zero traffic — the strategy is the lesson, not the optimization.
      DeploymentDurationInMinutes: 10
      FinalBakeTimeInMinutes: 5
      GrowthFactor: 10.0
      GrowthType: LINEAR
      ReplicateTo: NONE

  # -------------------------------------------------------------------------
  # AppConfig content + Deployments — THE W7 TRAP
  #
  # The system-prompt seed is read from infra/sam/reply-agent/config/system-prompt.seed.json.
  # That file deliberately LACKS the 'version' field — see Task 1 commit.
  # Validator on SystemPromptProfile (Task 3) rejects → CFN rolls back the
  # entire stack update on first deploy.
  #
  # Task 8 (Commit B) adds the version field and re-deploys.
  # -------------------------------------------------------------------------

  SystemPromptVersion:
    Type: AWS::AppConfig::HostedConfigurationVersion
    Properties:
      ApplicationId: !Ref ReplyAgentApplication
      ConfigurationProfileId: !Ref SystemPromptProfile
      ContentType: application/json
      Description: Initial host voice config seed (Phase 2)
      Content: "__SYSTEM_PROMPT_SEED_PLACEHOLDER__"

  FeatureFlagsVersion:
    Type: AWS::AppConfig::HostedConfigurationVersion
    Properties:
      ApplicationId: !Ref ReplyAgentApplication
      ConfigurationProfileId: !Ref FeatureFlagsProfile
      ContentType: application/json
      Description: Initial feature flag content (Phase 2, flag has no consumer until Phase 3)
      Content: "__FEATURE_FLAGS_SEED_PLACEHOLDER__"

  SystemPromptDeployment:
    Type: AWS::AppConfig::Deployment
    Properties:
      ApplicationId: !Ref ReplyAgentApplication
      EnvironmentId: !Ref ReplyAgentProdEnvironment
      ConfigurationProfileId: !Ref SystemPromptProfile
      ConfigurationVersion: !Ref SystemPromptVersion
      DeploymentStrategyId: !Ref LinearDeploymentStrategy
      Description: Initial deployment of host voice config

  FeatureFlagsDeployment:
    Type: AWS::AppConfig::Deployment
    DependsOn: SystemPromptDeployment
    Properties:
      ApplicationId: !Ref ReplyAgentApplication
      EnvironmentId: !Ref ReplyAgentProdEnvironment
      ConfigurationProfileId: !Ref FeatureFlagsProfile
      ConfigurationVersion: !Ref FeatureFlagsVersion
      DeploymentStrategyId: !Ref LinearDeploymentStrategy
      Description: Initial deployment of feature flags

  # -------------------------------------------------------------------------
  # 2. CloudWatch log groups — one per state machine, with explicit retention.
  #    Express SFN can ONLY log via these (no execution history retained).
  # -------------------------------------------------------------------------

  AIChainLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vendedlogs/states/casa-coqui-ai-chain
      RetentionInDays: !Ref LogRetentionDays

  ReplyDraftLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vendedlogs/states/casa-coqui-reply-draft
      RetentionInDays: !Ref LogRetentionDays

  # -------------------------------------------------------------------------
  # 3. SFN Express — the inner AI chain (Reasoner → Drafter → Evaluator → Reviser?)
  #    Express type: cheap, sub-30s, logs only (no exec history). Perfect for
  #    a hot synchronous AI chain.
  # -------------------------------------------------------------------------

  AIChainStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: casa-coqui-ai-chain
      Type: EXPRESS
      DefinitionUri: statemachines/ai-chain.asl.json
      DefinitionSubstitutions:
        ReasonerArn: !GetAtt ReasonerFunction.Arn
        DrafterArn: !GetAtt DrafterFunction.Arn
        EvaluatorArn: !GetAtt EvaluatorFunction.Arn
        ReviserArn: !GetAtt ReviserFunction.Arn
      Logging:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt AIChainLogGroup.Arn
      Tracing:
        Enabled: true                   # X-Ray
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ReasonerFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref DrafterFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref EvaluatorFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ReviserFunction
        - CloudWatchLogsFullAccess

  # -------------------------------------------------------------------------
  # 4. SFN Standard — the outer orchestration (Load → RAG → AIChain → WriteBack)
  #    Standard type: 90-day execution history, slightly more expensive but
  #    fine because we run this maybe 100x/day total.
  # -------------------------------------------------------------------------

  ReplyDraftStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: casa-coqui-reply-draft
      Type: STANDARD
      DefinitionUri: statemachines/reply-draft.asl.json
      DefinitionSubstitutions:
        LoadConfigArn: !GetAtt LoadConfigFunction.Arn
        RAGRetrieveArn: !GetAtt RAGRetrieveFunction.Arn
        WriteBackArn: !GetAtt WriteBackFunction.Arn
        AIChainArn: !GetAtt AIChainStateMachine.Arn
        ReplyDraftDLQUrl: !Ref ReplyDraftDLQ
      Logging:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt ReplyDraftLogGroup.Arn
      Tracing:
        Enabled: true
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref LoadConfigFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref RAGRetrieveFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref WriteBackFunction
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt AIChainStateMachine.Name
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ReplyDraftDLQ.QueueName
        - CloudWatchLogsFullAccess
        # Required for arn:aws:states:::states:startExecution.sync:2 — SFN
        # creates a managed EventBridge rule to receive child-execution
        # completion events. Without these perms, CFN fails with:
        #   "is not authorized to create managed-rule (HandlerErrorCode: AccessDenied)"
        # SAM's auto-generated StepFunctionsExecutionPolicy connector does NOT
        # include these — must be added explicitly.
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - events:PutRule
                - events:PutTargets
                - events:DeleteRule
                - events:RemoveTargets
                - events:DescribeRule
              Resource:
                - !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForStepFunctionsExecutionRule

# ---------------------------------------------------------------------------
# Outputs — surfaced after deploy. Useful for the Firebase trigger that calls
# StartExecution (will read these in Phase 3).
# ---------------------------------------------------------------------------
Outputs:
  ReplyDraftStateMachineArn:
    Description: ARN of the outer Standard state machine (entry point for new emails)
    Value: !Ref ReplyDraftStateMachine
    Export:
      Name: CasaCoquiReplyDraftStateMachineArn

  AIChainStateMachineArn:
    Description: ARN of the inner Express state machine (referenced by ReplyDraft)
    Value: !Ref AIChainStateMachine

  WriteBackFunctionArn:
    Value: !GetAtt WriteBackFunction.Arn
